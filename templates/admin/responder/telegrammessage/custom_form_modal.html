{% extends "admin/change_list.html" %}
{% load i18n admin_urls static jazzmin %}

{% block result_list %}
    {{ block.super }}

    {% for object in cl.result_list %}
        <!-- Кнопка для открытия модального окна -->
        <button type="button"
                class="btn btn-sm btn-primary"
                data-toggle="modal"
                data-target="#modal-{{ object.id }}">
            Открыть форму для {{ object }}
        </button>

        <!-- Само модальное окно -->
        <div class="modal fade" id="modal-{{ object.id }}" tabindex="-1" role="dialog" aria-labelledby="modalLabel-{{ object.id }}" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalLabel-{{ object.id }}">Форма для {{ object }}</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Закрыть">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form action="{% url 'admin:yourmodel-custom-form' object.id %}" method="post">
                            {% csrf_token %}
                            {{ form.as_p }}  {# Убедитесь, что передаете правильную форму #}
                            <button type="submit" class="btn btn-success">Сохранить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
{% endblock %}
