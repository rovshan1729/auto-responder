{% extends "admin/change_list.html" %}

{% block content %}
    {{ block.super }}

    <!-- Универсальный модальный -->
    <div class="modal fade" id="universalModal" tabindex="-1" role="dialog" aria-labelledby="universalModalLabel"
         aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <form method="post" action="#">
                    {% csrf_token %}
                    <div class="modal-header">
                        <h5 class="modal-title" id="universalModalLabel">Редактировать</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Закрыть">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="universalInput">Имя</label>
                            <input type="text" class="form-control" id="universalInput" name="name" value="">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрыть</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
